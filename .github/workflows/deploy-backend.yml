name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::686061660942:role/GitHubActionsDeployRole
          aws-region: us-east-1

      - name: Install dependencies
        run: npm ci

      # FrontendStack stages ../frontend/dist at synth time, so the directory must
      # exist even though this workflow only deploys BackendStack. Creating it empty
      # is enough to synth; it is never uploaded because the deploy is scoped below.
      - name: Create placeholder frontend asset dir
        run: mkdir -p ../frontend/dist

      - name: Deploy with CDK
        run: npx cdk deploy BackendStack --require-approval never
